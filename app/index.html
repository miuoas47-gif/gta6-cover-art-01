<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City Nights — GTA-style Cover Art Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover editor">
    <header>
      <h1>Vice City Nights</h1>
      <p>Turn your photo into GTA-style poster cover art. Pick a layout, drop in a photo, write a caption, export a PNG.</p>
    </header>

    <fieldset class="group">
      <legend>1 · Layout</legend>
      <div class="seg" id="layoutSeg" role="group" aria-label="Panel layout">
        <button type="button" data-layout="1" aria-pressed="true">1 photo</button>
        <button type="button" data-layout="2" aria-pressed="false">2 panels</button>
        <button type="button" data-layout="3" aria-pressed="false">3 panels</button>
        <button type="button" data-layout="4" aria-pressed="false">4 panels</button>
      </div>
    </fieldset>

    <fieldset class="group">
      <legend>2 · Photo</legend>
      <div class="samples">
        <span>Try a sample:</span>
        <button type="button" class="sample" data-sample="boulevard">Boulevard</button>
        <button type="button" class="sample" data-sample="pier">Pier</button>
      </div>
      <label class="file">Upload a photo for panel <span id="panelLabel">1</span>
        <input id="photo" type="file" accept="image/*">
      </label>
      <div class="panel-tabs" id="panelTabs" role="group" aria-label="Choose panel to edit"></div>
      <label>Zoom <input id="zoom" type="range" min="1" max="3" step="0.05" value="1"></label>
      <label>Position X <input id="posx" type="range" min="-1" max="1" step="0.05" value="0"></label>
      <label>Position Y <input id="posy" type="range" min="-1" max="1" step="0.05" value="0"></label>
      <button type="button" id="fillAll">Use this photo in every panel</button>
    </fieldset>

    <fieldset class="group">
      <legend>3 · Words &amp; grade</legend>
      <label>Caption <input id="caption" type="text" maxlength="36" value="VICE CITY NIGHTS"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="48" value="Sunset heist · Leonida"></label>
      <label>Caption size <input id="capSize" type="range" min="0.6" max="1.5" step="0.05" value="1"></label>
      <label>Caption position
        <select id="capPos">
          <option value="bottom" selected>Bottom</option>
          <option value="top">Top</option>
        </select>
      </label>
      <label class="check"><input id="outline" type="checkbox" checked> Bold outline on caption</label>
      <label>Colour grade
        <select id="grade">
          <option value="sunset" selected>Sunset — orange &amp; magenta</option>
          <option value="neon">Neon — cyan &amp; pink</option>
          <option value="noir">Noir — dark &amp; moody</option>
          <option value="vice">Vice — hot pink &amp; teal</option>
        </select>
      </label>
    </fieldset>

    <fieldset class="group">
      <legend>4 · Export</legend>
      <label>Post size
        <select id="size">
          <option value="1080x1080" selected>Square · 1080 × 1080</option>
          <option value="1080x1350">Portrait · 1080 × 1350</option>
          <option value="1920x1080">Landscape · 1920 × 1080</option>
        </select>
      </label>
      <button type="button" id="export" class="primary">Export PNG</button>
      <p id="status" role="status"></p>
    </fieldset>
    <p class="fine">Photos stay on your machine — nothing is uploaded. Original art made here; no game logos or artwork.</p>
  </section>

  <section class="preview" aria-label="Live preview">
    <canvas id="cover" width="1080" height="1080"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
